[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "palette-trace"
version = "1.0.0"
description = "Art-directed multicolour bitmap tracing, as an Inkscape extension and a standalone local web application"
readme = "README.md"
authors = [{ name = "Christian Sabourin" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"

# The headless core and the standalone host need only these. `potracer` is the
# reference tracing backend selected by ADR-0001, so it is not optional.
dependencies = [
    "Pillow>=9.0.0",
    "numpy>=1.20.0",
    "potracer>=0.0.4",
]

[project.optional-dependencies]
# Required only for the Inkscape extension host; the standalone host does not
# import inkex. See SPEC §9.4.
inkscape = [
    "inkex>=1.2.0",
]
# Additional backend candidates evaluated by the Phase 0 spike (SPEC §23.6).
backends = [
    "vtracer>=0.6.0",
]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
palette-trace-web = "palette_trace.standalone:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.setuptools.packages.find]
include = ["palette_trace*"]
exclude = ["schemas*", "tests*"]

[tool.setuptools.package-data]
palette_trace = ["data/*.json", "web/*"]
