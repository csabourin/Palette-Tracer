[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "palette-trace"
version = "1.0.0"
description = "Art-directed multicolour bitmap tracing, as an Inkscape extension and a standalone local web application"
readme = "README.md"
authors = [{ name = "Christian Sabourin" }]
license = { text = "GPL-3.0-or-later" }
# 3.11 rather than 3.9: `color/conversion.py` calls `math.cbrt`, added in 3.11,
# and the annotations throughout use PEP 604 unions, which are evaluated at
# definition time and so need 3.10. The package does not import below this.
requires-python = ">=3.11"

# The headless core and the standalone host need only these. `potracer` is the
# reference tracing backend selected by ADR-0001, so it is not optional.
dependencies = [
    "Pillow>=9.0.0",
    "numpy>=1.20.0",
    "potracer>=0.0.4",
    "scipy>=1.13.1",
]

[project.optional-dependencies]
# Required only for the Inkscape extension host; the standalone host does not
# import inkex. See SPEC §9.4.
inkscape = [
    "inkex>=1.2.0",
]
# Additional backend candidates evaluated by the Phase 0 spike (SPEC §23.6).
backends = [
    "vtracer>=0.6.0",
]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
palette-trace-web = "palette_trace.standalone:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "SIM", "C4", "RET", "PIE", "ERA"]

[tool.ruff.lint.per-file-ignores]
# `l`, `m` and `s` are the LMS cone responses the OKLab transform is defined
# in terms of. The published notation is what makes this code checkable
# against the reference; a less ambiguous name would be a less faithful one.
"palette_trace/color/conversion.py" = ["E741"]

[tool.setuptools.packages.find]
include = ["palette_trace*"]
exclude = ["schemas*", "tests*"]

[tool.setuptools.package-data]
palette_trace = ["data/*.json", "web/*"]
