# cargo-deny configuration (SPEC §37.4, PTE-SEC-011, PTE-SEC-012).
#
# `cargo deny check` is release-blocking (PTE-LIC-005). The allowlist below is
# reviewed into the repository rather than generated, so admitting a new
# licence is a visible diff.

[licenses]
version = 2
# Every licence the engine's dependency closure is permitted to use. GPL and
# LGPL are absent by construction (PTE-LIC-002, PTE-LIC-003) -- adding either
# requires an ADR, not an edit here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # `arrayref`, reached through `blake3`, is BSD-2-Clause and only that: it
    # offers no dual licence to fall back on. Two clauses, both satisfied by the
    # attribution `THIRD_PARTY_NOTICES.md` already carries, and no patent or
    # copyleft term. Compatible with distribution in the MIT engine.
    "BSD-2-Clause",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# PTE-ARCH-001: the algorithmic core is host-free. These crates imply a host.
deny = [
    { name = "rayon", wrappers = [] },        # §19.6 parallelism is unimplemented
    { name = "tokio" },
    { name = "reqwest" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# PTE-SEC-012: git dependencies and unpinned forks are prohibited in release
# artefacts. The list is empty and must stay empty without an ADR.
allow-git = []

[advisories]
version = 2
yanked = "deny"
ignore = []
